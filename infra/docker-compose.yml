services:
  postgres:
    image: postgres:16
    container_name: vmais-agenda-postgres
    environment:
      POSTGRES_DB: vmais_agenda
      POSTGRES_USER: vmais
      POSTGRES_PASSWORD: vmais
    ports:
      - "5432:5432"
    volumes:
      - vmais_agenda_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmais -d vmais_agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: vmais-agenda-backend
    command: ["sh", "./mvnw", "spring-boot:run"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vmais_agenda
      DATABASE_USERNAME: vmais
      DATABASE_PASSWORD: vmais
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173,http://[::1]:5173,http://192.168.*:5173,http://10.*:5173,http://172.*:5173
      JWT_SECRET: vmais-local-development-secret-change-this-value-with-at-least-32-chars
      VMAIS_ADMIN_EMAIL: admin@vmais.local
      VMAIS_ADMIN_PASSWORD: admin123
      VMAIS_ADMIN_NAME: Administrador Vmais
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app:z
      - vmais_maven_cache:/root/.m2

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: vmais-agenda-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app:z
      - vmais_frontend_node_modules:/app/node_modules

volumes:
  vmais_agenda_data:
  vmais_maven_cache:
  vmais_frontend_node_modules:
