services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: vmais-agenda-backend-prod
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      VMAIS_ADMIN_EMAIL: ${VMAIS_ADMIN_EMAIL}
      VMAIS_ADMIN_PASSWORD: ${VMAIS_ADMIN_PASSWORD}
      VMAIS_ADMIN_NAME: ${VMAIS_ADMIN_NAME}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: vmais-agenda-frontend-prod
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    restart: unless-stopped
