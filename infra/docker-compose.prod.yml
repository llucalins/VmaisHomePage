services:
  backend:
    image: ghcr.io/${GHCR_IMAGE_OWNER}/vmais-homepage-backend:latest
    pull_policy: always
    container_name: vmais-agenda-backend-prod
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      VMAIS_ADMIN_EMAIL: ${VMAIS_ADMIN_EMAIL}
      VMAIS_ADMIN_PASSWORD: ${VMAIS_ADMIN_PASSWORD}
      VMAIS_ADMIN_NAME: ${VMAIS_ADMIN_NAME}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-agenciavmaiscomunicacao@gmail.com}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-no-reply@vmais.local}
      CONTACT_MAIL_ENABLED: ${CONTACT_MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_IMAGE_OWNER}/vmais-homepage-frontend:latest
    pull_policy: always
    container_name: vmais-agenda-frontend-prod
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    restart: unless-stopped