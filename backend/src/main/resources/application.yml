server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vmais_agenda}
    username: ${DATABASE_USERNAME:vmais}
    password: ${DATABASE_PASSWORD:vmais}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  contact:
    recipient-email: ${CONTACT_RECIPIENT_EMAIL:agenciavmaiscomunicacao@gmail.com}
    from-email: ${CONTACT_FROM_EMAIL:no-reply@vmais.local}
    mail-enabled: ${CONTACT_MAIL_ENABLED:false}
  security:
    jwt-secret: ${JWT_SECRET:vmais-local-development-secret-change-this-value-with-at-least-32-chars}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  bootstrap:
    admin-email: ${VMAIS_ADMIN_EMAIL:admin@vmais.local}
    admin-password: ${VMAIS_ADMIN_PASSWORD:admin123}
    admin-name: ${VMAIS_ADMIN_NAME:Administrador Vmais}
